[project]
name = "pickem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JJ", email = "jj.miller.jm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "discord.py>=2.6,<3",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "nflreadpy>=0.1.5",
    "polars[rtcompat]>=1.43.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7,<2",
    "typer>=0.27.1",
]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
pickem = "pickem.cli:app"
pickem-discord-bot = "pickem.discord_bot:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
